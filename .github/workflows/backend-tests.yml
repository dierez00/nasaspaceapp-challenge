name: backend-tests

on:
  push:
    branches: [backend]
  pull_request:
    branches: [backend]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 2s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://atlas:atlas@localhost:5433/atlas
      ATLAS_TEST_DATABASE_URL: postgresql://atlas:atlas@localhost:5433/atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Validate experiment data
        run: atlas-validate
      - name: Load experiments into Postgres
        run: atlas-load
      - name: Run tests, including the Postgres ones
        run: pytest -rs
