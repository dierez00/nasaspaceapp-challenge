[project]
name = "atlas-api"
version = "0.1.0"
description = "Backend for the Lunar Fire Atlas: PSI experiment data, search and agents."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
atlas-validate = "atlas.experiments.application.validate:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
