[project]
name = "atlas-api"
version = "0.1.0"
description = "Backend for the Lunar Fire Atlas: PSI experiment data, search and agents."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.3",
  "voyageai>=0.6,<1",
  "claude-agent-sdk>=0.2.182,<0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
atlas-validate = "atlas.experiments.application.validate:main"
atlas-load = "atlas.experiments.application.load_into_database:main"
atlas-index = "atlas.search.application.index_documents:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"atlas.agents.application" = ["prompts/*.md"]
